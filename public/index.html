<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Office - Relay Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .status-bar {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 24px;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: #334155;
      display: inline-block;
      width: 100%;
    }
    .status-online { color: #4ade80; }
    .status-offline { color: #f87171; }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 28px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(28px);
    }

    .global-controls {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-on {
      background-color: #0369a1;
      color: #ffffff;
    }
    .btn-on:hover { background-color: #0284c7; }
    .btn-off {
      background-color: #b91c1c;
      color: #ffffff;
    }
    .btn-off:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Smart Office Control</h1>
    <div class="status-bar">
      สถานะการเชื่อมต่อ: <span id="wsStatus" class="status-offline">กำลังเชื่อมต่อ...</span>
    </div>

    <div class="grid">
      <!-- Relay 1 (Channel 0 - GPIO 26) -->
      <div class="card" id="card-0">
        <h3>Relay 1 (GPIO 26)</h3>
        <label class="switch">
          <input type="checkbox" id="relay-0" onchange="toggleRelay(0, this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Relay 2 (Channel 1 - GPIO 25) -->
      <div class="card" id="card-1">
        <h3>Relay 2 (GPIO 25)</h3>
        <label class="switch">
          <input type="checkbox" id="relay-1" onchange="toggleRelay(1, this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Relay 3 (Channel 2 - GPIO 33) -->
      <div class="card" id="card-2">
        <h3>Relay 3 (GPIO 33)</h3>
        <label class="switch">
          <input type="checkbox" id="relay-2" onchange="toggleRelay(2, this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Relay 4 (Channel 3 - GPIO 32) -->
      <div class="card" id="card-3">
        <h3>Relay 4 (GPIO 32)</h3>
        <label class="switch">
          <input type="checkbox" id="relay-3" onchange="toggleRelay(3, this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="global-controls">
      <button class="btn btn-on" onclick="controlAll(true)">เปิดทั้งหมด</button>
      <button class="btn btn-off" onclick="controlAll(false)">ปิดทั้งหมด</button>
    </div>
  </div>

  <script>
    // ตรวจสอบและเลือก Protocol (ws:// หรือ wss://) อัตโนมัติ
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/esp`;
    let socket;

    function connectWebSocket() {
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        const statusElem = document.getElementById('wsStatus');
        statusElem.textContent = 'เชื่อมต่อแล้ว';
        statusElem.className = 'status-online';
        socket.send(JSON.stringify({ type: 'GET_STATE' }));
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          if (data.relays && Array.isArray(data.relays)) {
            data.relays.forEach((state, index) => {
              if (index < 4) updateUI(index, state);
            });
          } 
          else if (data.type === 'CONTROL') {
            updateUI(data.ch, data.state);
          } 
          else if (data.type === 'CONTROL_ALL') {
            for (let i = 0; i < 4; i++) {
              updateUI(i, data.state);
            }
          }
        } catch (e) {
          console.error('Error parsing WS message:', e);
        }
      };

      socket.onclose = () => {
        const statusElem = document.getElementById('wsStatus');
        statusElem.textContent = 'ขาดการเชื่อมต่อ (กำลังต่อใหม่...)';
        statusElem.className = 'status-offline';
        setTimeout(connectWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error('WebSocket Error:', err);
      };
    }

    function updateUI(ch, state) {
      const toggle = document.getElementById(`relay-${ch}`);
      const card = document.getElementById(`card-${ch}`);
      if (toggle) toggle.checked = state;
      if (card) {
        if (state) card.classList.add('active');
        else card.classList.remove('active');
      }
    }

    function toggleRelay(ch, state) {
      fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ch: ch, state: state })
      }).catch(err => console.error('Fetch error:', err));
    }

    function controlAll(state) {
      fetch('/api/control-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: state })
      }).catch(err => console.error('Fetch error:', err));
    }

    connectWebSocket();
  </script>
</body>
</html>

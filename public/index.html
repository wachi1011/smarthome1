<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDR & Relay Control Dashboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; margin: 10px auto; width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; }
        button.active { background: #28a745; }
    </style>
</head>
<body>
    <h1>ระบบควบคุมรีเลย์ (LDR Control)</h1>
    <div class="card">
        <h3>ค่าแสงจาก LDR</h3>
        <p id="ldr-val">กำลังโหลด...</p>
    </div>

    <div class="card">
        <h3>รีเลย์ Pin 32</h3>
        <button onclick="toggleRelay('relay1')" id="btn-relay1">ปิดอยู่</button>
    </div>

    <div class="card">
        <h3>รีเลย์ Pin 33</h3>
        <button onclick="toggleRelay('relay2')" id="btn-relay2">ปิดอยู่</button>
    </div>

    <script>
        async function fetchStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('ldr-val').innerText = data.ldrValue;
            
            // อัปเดตสถานะปุ่มตามค่าจริง
            updateButton('relay1', data.relayState.relay1);
            updateButton('relay2', data.relayState.relay2);
        }

        async function toggleRelay(relay) {
            const res = await fetch('/api/status');
            const data = await res.json();
            const currentState = data.relayState[relay];

            await fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ relay, state: !currentState })
            });
            fetchStatus();
        }

        function updateButton(relay, state) {
            const btn = document.getElementById(`btn-${relay}`);
            if (state) {
                btn.innerText = "เปิดทำงาน";
                btn.className = "active";
            } else {
                btn.innerText = "ปิดอยู่";
                btn.className = "";
            }
        }

        setInterval(fetchStatus, 2000); // อัปเดตข้อมูลทุกๆ 2 วินาที
        fetchStatus();
    </script>
</body>
</html>
